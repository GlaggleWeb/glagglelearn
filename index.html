<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glaggle Learn</title> 

<!-- Zentrales Theme & Components — überall gleich einbinden -->
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/components.js" defer></script>

<style>
  .wrap {
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    text-align: center;
  }
  h1 { margin-bottom: 8px; }
  p.sub { color: var(--gl-text-soft); margin-bottom: 32px; }
  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>🎓 Glaggle Learn</h1>
  <p class="sub">So sieht das zentrale Button-System aus — nur ein Tag, kein wiederholtes CSS.</p>

  <glaggle-card>
    <div class="btn-row">
      <glaggle-button text="▶ Lektion 1 starten" variant="primary" full-width id="btnLektion1"></glaggle-button>
      <glaggle-button text="Weiter" variant="primary" full-width id="btnWeiter"></glaggle-button>
      <glaggle-button text="Zurück" variant="secondary" full-width></glaggle-button>
      <glaggle-button text="Abbrechen" variant="danger" full-width></glaggle-button>
      <glaggle-button text="Deaktiviert" variant="primary" full-width disabled></glaggle-button>
    </div>
  </glaggle-card>
</div>

<script>
  // So reagierst du auf einen Klick — 'glaggle-click' statt normalem 'click'
  document.getElementById('btnWeiter').addEventListener('glaggle-click', () => {
    alert('Weiter geklickt!');
  });
  document.getElementById('btnLektion1').addEventListener('glaggle-click', () => {
    window.location.href = 'lektionen/lektion1.html';
  });
</script>

</body>
</html>
