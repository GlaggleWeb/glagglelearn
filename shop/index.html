<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glaggle Learn | Shop</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Minimale, spezifische Shop-Styles, die auf den bestehenden CSS-Variablen aufbauen */
  .gl-shop-balance-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--gl-space-2);
    width: 100%;
  }
  .gl-shop-balance-item {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }
  .gl-shop-balance-item .gl-node-title {
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gl-shop-balance-item img.gl-coin-icon {
    width: 26px;
    height: 26px;
    object-fit: contain;
  }
  .gl-shop-convert-card {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    padding: 32px 24px;
  }
  .gl-shop-convert-card .gl-node-icon {
    width: 64px;
    height: 64px;
    font-size: 2rem;
  }
  .gl-convert-btn {
    width: 100%;
    max-width: 320px;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 800;
    background: var(--gl-primary);
    color: var(--gl-text-on-accent);
    border-color: var(--gl-primary-shadow);
    border-bottom-width: 4px;
    transition: transform 0.1s ease, border-bottom-width 0.1s ease;
  }
  .gl-convert-btn:hover:not(:disabled) {
    background: var(--gl-primary-hover);
    transform: translateY(-2px);
  }
  .gl-convert-btn:active:not(:disabled) {
    transform: translateY(2px);
    border-bottom-width: 2px;
  }
  .gl-convert-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .gl-convert-message {
    min-height: 1.2em;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gl-danger);
  }
  /* Animation für erfolgreiche Umwandlung */
  .gl-flash-coin {
    animation: glCoinFlash 0.5s ease;
  }
  @keyframes glCoinFlash {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); background: var(--gl-ok-bg); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="gl-home-wrap">

  <!-- ========== NAVBAR: 100% identisch zur Startseite/Overviews ========== -->
  <div class="gl-overview-header">
    <a class="gl-home-brand" href="index.html">
      <img src="https://glaggle.ch/glame/glagglesonne.png" alt="Glaggle Sun">
      <span class="gl-home-brand-name">LEARN</span>
    </a>

    <div class="gl-header-tools">
      <div class="gl-crystal-pill" id="glCrystalPill" title="Deine Crystals">💎 <span id="glCrystalCount">0</span></div>

      <!-- Lupe: 100% identisch zu den Overviews -->
      <div class="gl-subject-search" id="glSearchWrap">
        <div class="gl-subject-search-field">
          <input type="search" id="glSearch" placeholder="Fach oder Lektion suchen…" autocomplete="off">
          <button type="button" class="gl-subject-search-clear" id="glSearchClear" title="Suche leeren" hidden>✕</button>
        </div>
        <button type="button" class="gl-subject-search-btn" id="glSearchBtn" title="Suchen">🔎</button>
      </div>
    </div>
  </div>

  <!-- ========== BODY: Content links, Sidebar rechts (mobil: unten) ========== -->
  <div class="gl-home-body">

    <div class="gl-overview-content">
      <div class="gl-subject-main">

        <section class="gl-subject-group">
          <h2 class="gl-subject-group-label">Glaggle Shop</h2>
          
          <!-- Guthaben-Anzeige -->
          <div class="gl-node-box gl-static" style="margin-bottom: 24px;">
            <div class="gl-shop-balance-row">
              <div class="gl-shop-balance-item">
                <div class="gl-node-icon gl-tone-deutsch" style="font-size: 1.5rem;">💎</div>
                <div>
                  <div class="gl-node-sub" style="margin-bottom: 2px;">Deine Crystals</div>
                  <div class="gl-node-title" id="shopCrystalDisplay">0</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Umwandlungs-Karte -->
          <div class="gl-node-box gl-static gl-shop-convert-card" id="glConvertCard">
            <div class="gl-node-icon gl-tone-mathe">💱</div>
            <div>
              <div class="gl-node-title" style="font-size: 1.1rem; margin-bottom: 8px;">Crystals in Coins umwandeln</div>
              <div class="gl-node-sub" style="font-size: 0.9rem;">Kurs: 10 Crystals = 1 Glaggle Coin</div>
            </div>
            
            <button id="glConvertBtn" class="gl-option gl-convert-btn">
              10 💎 in 1 🪙 umwandeln
            </button>
            
            <div id="glConvertMessage" class="gl-convert-message"></div>
          </div>

        </section>
      </div>
    </div>

    <!-- ========== SIDEBAR: LP, Fächer, HOME (statt Shop), Settings ========== -->
    <nav class="gl-sidebar" aria-label="Schnellnavigation">
      <div class="gl-lp-badge" title="Deine Learn Points">
        <img src="../shared/lp.png" alt="" onerror="this.remove()">
        <span class="gl-lp-value" id="glSidebarLP">0</span>
      </div>

      <div class="gl-sidebar-divider"></div>

      <a class="gl-sidebar-icon gl-tone-mathe" href="lektionen/mathe/index.html" title="Mathe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="9" x2="20" y2="9"></line>
          <line x1="4" y1="15" x2="20" y2="15"></line>
          <line x1="10" y1="3" x2="8" y2="21"></line>
          <line x1="16" y1="3" x2="14" y2="21"></line>
        </svg>
      </a>

      <a class="gl-sidebar-icon gl-tone-deutsch" href="lektionen/deutsch/index.html" title="Deutsch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5V6a2 2 0 0 1 2-2h11.5"></path>
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4"></path>
          <line x1="8" y1="7" x2="15" y2="7"></line>
        </svg>
      </a>

      <a class="gl-sidebar-icon gl-tone-nmg" href="lektionen/nmg/index.html" title="NMG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"></path>
        </svg>
      </a>

      <div class="gl-sidebar-divider"></div>

      <!-- HIER: Home-Icon statt Shop-Icon, da wir uns im Shop befinden -->
      <a class="gl-sidebar-icon gl-tone-mathe" href="index.html" title="Startseite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>

      <div class="gl-sidebar-spacer"></div>

      <a class="gl-sidebar-icon gl-settings" href="einstellungen.html" title="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0 1.51-1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </nav>

  </div>
</div>

<script>
  (function () {
    'use strict';

    function readJson(key) {
      try {
        const o = JSON.parse(localStorage.getItem(key) || '{}');
        return (o && typeof o === 'object') ? o : {};
      } catch (e) { return {}; }
    }

    function norm(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    /* ---------- UI Aktualisieren ---------- */
    function updateShopUI() {
      // 1. Daten lesen
      const crystalData = readJson('glaggleCrystalData');
      const crystals = typeof crystalData.total === 'number' ? crystalData.total : 0;
      const coins = parseInt(localStorage.getItem('glaggleCoins') || '0', 10);
      const lp = parseInt(localStorage.getItem('glaggleLearnPoints'), 10);

      // 2. Header & Sidebar Pills befüllen
      document.getElementById('glCrystalCount').textContent = crystals;
      document.getElementById('glSidebarLP').textContent = Number.isFinite(lp) ? lp : 0;

      // 3. Shop-Anzeige aktualisieren
      document.getElementById('shopCrystalDisplay').textContent = crystals;

      // 4. Button-Status prüfen
      const btn = document.getElementById('glConvertBtn');
      const msg = document.getElementById('glConvertMessage');
      
      if (crystals >= 10) {
        btn.disabled = false;
        btn.textContent = '10 💎 in 1 Glaggle Coin umwandeln';
        msg.textContent = '';
      } else {
        btn.disabled = true;
        btn.textContent = 'Nicht genug Crystals';
        msg.textContent = 'Du benötigst mindestens 10 Crystals für eine Umwandlung.';
      }
    }

document.getElementById('glConvertBtn').addEventListener('click', function() {
  const crystalData = readJson('glaggleCrystalData');
  const total = typeof crystalData.total === 'number' ? crystalData.total : 0;
  let coins = parseInt(localStorage.getItem('glaggleCoins') || '0', 10);

  if (total >= 10) {
    crystalData.spent = (Number(crystalData.spent) || 0) + 10;
    crystalData.total = Math.max(total - 10, 0);
    coins += 1;

localStorage.setItem('glaggleCrystalData', JSON.stringify(crystalData));
localStorage.setItem('glaggleCoins', coins.toString());

if (window.GlaggleCloud && window.GlaggleCloud.loggedIn) {
  await window.GlaggleCloud.flush();
}

    const card = document.getElementById('glConvertCard');
    card.classList.add('gl-flash-coin');
    setTimeout(() => card.classList.remove('gl-flash-coin'), 500);

    const redirectUrl = `https://glaggle.ch/gamecenter/coins?q=1&return=${encodeURIComponent(window.location.href)}`;
    const syncTab = window.open(redirectUrl, '_blank');
    if (!syncTab || syncTab.closed || typeof syncTab.closed == 'undefined') {
        window.location.href = redirectUrl;
    }

    updateShopUI();
  }
});

    /* ---------- Lupe: identisches Verhalten wie in den Overviews ---------- */
    const wrap = document.getElementById('glSearchWrap');
    const btn = document.getElementById('glSearchBtn');
    const input = document.getElementById('glSearch');
    const clear = document.getElementById('glSearchClear');

   // SUCHVERHALTEN ÄNDERN
function applyQuery(value) {
  clear.hidden = value === '';
  
  if (!value) return;
  
  const query = norm(value);
  
  // Direkte Navigation basierend auf Suchbegriff
  if (query.includes('coin') || query.includes('umwandeln') || query.includes('shop')) {
    // Bleibe hier (oder Scroll zu Umwandlung)
    document.getElementById('glConvertCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (query.includes('mathe')) {
    window.location.href = '../lektionen/mathe/index.html';
  }
  else if (query.includes('deutsch')) {
    window.location.href = '../lektionen/deutsch/index.html';
  }
  else if (query.includes('nmg')) {
    window.location.href = '../lektionen/nmg/index.html';
  }
  else if (query.includes('home') || query.includes('start')) {
    window.location.href = '../index.html';
  }
}
    function open() { wrap.classList.add('gl-open'); input.focus(); }
    function close(reset) {
      if (reset) { input.value = ''; applyQuery(''); }
      wrap.classList.remove('gl-open');
    }

    btn.addEventListener('click', function () {
      if (wrap.classList.contains('gl-open')) close(true); else open();
    });
    input.addEventListener('input', function () { applyQuery(input.value); });
    clear.addEventListener('click', function () { input.value = ''; applyQuery(''); input.focus(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
    input.addEventListener('blur', function () { if (input.value === '') close(false); });

    /* ---------- Initialisierung ---------- */
    updateShopUI();
    window.addEventListener('pageshow', function () { updateShopUI(); });
    // Höre auf Storage-Änderungen in anderen Tabs
    window.addEventListener('storage', function (e) {
      if (e.key === 'glaggleCrystalData' || e.key === 'glaggleCoins') {
        updateShopUI();
      }
    });
  })();
</script>

</body>
</html>
