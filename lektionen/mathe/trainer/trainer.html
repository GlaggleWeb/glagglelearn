<!DOCTYPE html>
<html lang="de">
<head>

  <!-- viewport-fit=cover + kein Zoom: wichtig fürs iPad/iPhone, sonst zoomt Safari beim Fokussieren ins Feld -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Einmaleins-Trainer | Glaggle Learn</title>

  <!-- 1) Zentrales Theme -->
  <link rel="stylesheet" href="../../shared/theme.css">

  <!-- 2) Web Components (glaggle-button, glaggle-card, glaggle-progress) -->
  <script src="../../shared/components.js"></script>

  <!-- 3) Train-Engine — OHNE defer/async laden, sonst existiert GlaggleTrainer beim mount() noch nicht -->

</head>
<body>
  <script>
    GlaggleTrainer.mount({
      type: 'einmaleins',                       // 'einmaleins' | 'plus' | 'minus'

      intro: 'Wie schnell bist du im kleinen Einmaleins? Wähle, ob du auf Zeit oder auf eine bestimmte Anzahl Aufgaben spielst.',
      backHref: '../index.html'
