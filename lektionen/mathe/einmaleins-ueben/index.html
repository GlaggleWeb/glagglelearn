<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einmaleins üben | Glaggle Learn</title>
<!-- Zentrales Theme & Components — auf JEDER Seite gleich einbinden.
     Kein eigenes <style> für Grundfarben/Fonts nötig — kommt aus theme.css -->
<link rel="stylesheet" href="../../../shared/theme.css">
<script src="../../../shared/components.js" defer></script>
<style>
  /* Nur Layout-Ergänzungen für diese Übersichtsseite — Farben, Radien,
     Schatten und Spacing kommen ausschliesslich aus theme.css (--gl-*),
     genau wie bei den Lektionsseiten selbst. */

  /* Header: 1:1 Kopie von .gl-lesson-header, inkl. sticky Progress-Zeile */
  .gl-overview-wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .gl-overview-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: var(--gl-space-2);
    padding: clamp(12px, 2vw, 16px) clamp(16px, 5vw, 32px);
    border-bottom: 1px solid var(--gl-border);
    flex-shrink: 0;
  }

  .gl-overview-header a {
    color: var(--gl-text-soft);
    text-decoration: none;
    font-size: 1.4rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .gl-overview-header a:hover {
    color: var(--gl-text);
  }

  .gl-overview-header h1 {
    font-size: clamp(1.15rem, 2.5vw, 1.4rem);
    margin: 0;
    color: var(--gl-text);
  }

  /* Content-Bereich: gleiches Padding-Schema wie .gl-lesson-content */
  .gl-overview-content {
    flex: 1;
    overflow-y: auto;
    padding: clamp(32px, 5vw, 48px) clamp(16px, 4vw, 32px);
    display: flex;
    justify-content: center;
  }

  .gl-path {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--gl-space-2);
  }

  .gl-path-intro {
    text-align: center;
    color: var(--gl-text-soft);
    line-height: 1.6;
    margin-bottom: var(--gl-space-2);
  }

  /* Jede Lektion ist ein Rechteck (glaggle-card-artig), aber
     wegmässig versetzt platziert statt in einer geraden Liste. */
  .gl-node-row {
    width: 100%;
    display: flex;
  }

  .gl-node-row:nth-child(3n+1) { justify-content: flex-start; }
  .gl-node-row:nth-child(3n+2) { justify-content: flex-end; }
  .gl-node-row:nth-child(3n)   { justify-content: center; }

  .gl-node {
    width: 78%;
    text-decoration: none;
    display: block;
  }

  .gl-node-box {
    display: flex;
    align-items: center;
    gap: var(--gl-space-2);
    background: var(--gl-surface);
    border: 1px solid var(--gl-border);
    border-radius: var(--gl-radius-md);
    padding: var(--gl-space-2);
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    position: relative;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .gl-node:not(.gl-locked):hover .gl-node-box {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.09);
  }

  .gl-node.gl-locked {
    cursor: not-allowed;
  }

  .gl-node-icon {
    width: 52px;
    height: 52px;
    border-radius: var(--gl-radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
  }

  .gl-node.gl-next .gl-node-icon {
    background: var(--gl-primary);
    box-shadow: 0 4px 0 var(--gl-primary-shadow);
    color: var(--gl-text-on-accent);
  }

  .gl-node.gl-done .gl-node-icon {
    background: var(--gl-secondary);
    box-shadow: 0 4px 0 var(--gl-secondary-shadow);
    color: var(--gl-text-on-accent);
  }

  .gl-node.gl-locked .gl-node-icon {
    background: var(--gl-border);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--gl-border) 60%, #000);
    color: var(--gl-text-soft);
  }

  .gl-node-body {
    flex: 1;
    min-width: 0;
  }

  .gl-node-title {
    font-weight: 800;
    font-size: 1rem;
    color: var(--gl-text);
    margin-bottom: 2px;
  }

  .gl-node.gl-locked .gl-node-title {
    color: var(--gl-text-soft);
  }

  .gl-node-sub {
    font-size: 0.8rem;
    color: var(--gl-text-soft);
  }

  /* Fortschrittsbalken je Lektion — nutzt die gl-input/gl-border-Radien
     aus dem Theme statt eigener Erfindung */
  .gl-node-bar-track {
    width: 100%;
    height: 8px;
    background: var(--gl-border);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }

  .gl-node-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gl-primary-hover), var(--gl-primary));
  }

  .gl-node-pct {
    flex-shrink: 0;
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--gl-text);
    min-width: 40px;
    text-align: right;
  }

  .gl-node-pct.gl-empty {
    color: var(--gl-text-soft);
    font-weight: 600;
  }

  .gl-node-badge {
    position: absolute;
    top: -10px;
    left: var(--gl-space-2);
    background: var(--gl-surface);
    color: var(--gl-primary-shadow);
    border: 2px solid var(--gl-primary);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .gl-path-footer {
    margin-top: var(--gl-space-2);
    text-align: center;
    color: var(--gl-text-soft);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="gl-overview-wrap" id="glWrap">
  <div class="gl-overview-header">
    <a href="https://learn.glaggle.ch/index.html" title="Zurück">✕</a>
    <h1>Einmaleins üben</h1>
  </div>

  <div class="gl-overview-content">
    <div class="gl-path">
      <p class="gl-path-intro">Arbeite dich Lektion für Lektion durch das Einmaleins — jede Runde hat 15 Fragen.</p>

      <div id="glPath"></div>

      <p class="gl-path-footer" id="glPathFooter"></p>
    </div>
  </div>
</div>

<script>
  // Jede Lektion referenziert ihre eigene HTML-Datei im gleichen Ordner.
  const LEKTIONEN = [
    { file: 'lektion-einmaleins.html',   label: 'Lektion 1', sub: '1–10er Reihen',         emoji: '🔢' },
    { file: 'lektion-einmaleins-2.html', label: 'Lektion 2', sub: 'Bunt gemischt',          emoji: '🎲' },
    { file: 'lektion-einmaleins-3.html', label: 'Lektion 3', sub: 'Bunt gemischt, Runde 2', emoji: '🎯' }
  ];

  // Wird zentral von lesson-engine.js beim Lektionsabschluss befüllt:
  // { "<dateiname>.html": { done: true, pct: 87, lastCompleted: "..." }, ... }
  const GL_PROGRESS_KEY = 'glaggleLessonProgress';

  function glGetProgress() {
    try {
      const raw = localStorage.getItem(GL_PROGRESS_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    } catch (e) {
      return {};
    }
  }

  function glRenderPath() {
    const progress = glGetProgress();
    const pathEl = document.getElementById('glPath');
    const footerEl = document.getElementById('glPathFooter');
    pathEl.innerHTML = '';

    let nextAssigned = false;

    LEKTIONEN.forEach((lek, i) => {
      const entry = progress[lek.file];
      const isDone = !!entry;
      const prevDone = i === 0 || !!progress[LEKTIONEN[i - 1].file];
      const isNext = !isDone && prevDone && !nextAssigned;
      if (isNext) nextAssigned = true;
      const isLocked = !isDone && !isNext;

      const stateClass = isDone ? 'gl-done' : (isNext ? 'gl-next' : 'gl-locked');
      const tag = isLocked ? 'div' : 'a';

      const pct = isDone ? entry.pct : 0;
      const pctLabel = isDone ? `${pct}%` : '–';

      const row = document.createElement('div');
      row.className = 'gl-node-row';

      const node = document.createElement(tag);
      node.className = 'gl-node ' + stateClass;
      if (!isLocked) node.setAttribute('href', lek.file);

      node.innerHTML = `
        <div class="gl-node-box">
          ${isNext ? '<div class="gl-node-badge">Weiter</div>' : ''}
          <div class="gl-node-icon">${isDone ? '✓' : (isLocked ? '🔒' : lek.emoji)}</div>
          <div class="gl-node-body">
            <div class="gl-node-title">${lek.label}</div>
            <div class="gl-node-sub">${lek.sub}</div>
            <div class="gl-node-bar-track">
              <div class="gl-node-bar-fill" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="gl-node-pct ${isDone ? '' : 'gl-empty'}">${pctLabel}</div>
        </div>
      `;

      row.appendChild(node);
      pathEl.appendChild(row);
    });

    const doneCount = LEKTIONEN.filter(l => progress[l.file]).length;
    footerEl.textContent = doneCount === LEKTIONEN.length
      ? '🎉 Alle Lektionen geschafft — stark!'
      : `${doneCount} von ${LEKTIONEN.length} Lektionen abgeschlossen`;
  }

  document.addEventListener('DOMContentLoaded', glRenderPath);
</script>

</body>
</html>
