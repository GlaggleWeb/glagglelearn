<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einmaleins üben | Glaggle Learn</title>
<!-- Zentrales Theme & Components — auf JEDER Seite gleich einbinden.
     Kein eigenes <style> für Grundfarben/Fonts nötig — kommt aus theme.css -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/components.js" defer></script>
<style>
  /* Nur Layout-Ergänzungen — Farben, Radien, Schatten und Spacing kommen
     ausschliesslich aus theme.css (--gl-*), genau wie auf den Lektionsseiten. */

  .gl-overview-wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header: 1:1 wie .gl-lesson-header (sticky, gleiche Masse, Kreuz statt Pfeil) */
  .gl-overview-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: var(--gl-space-2);
    padding: clamp(12px, 2vw, 16px) clamp(16px, 5vw, 32px);
    border-bottom: 1px solid var(--gl-border);
    flex-shrink: 0;
  }

  .gl-overview-header a {
    color: var(--gl-text-soft);
    text-decoration: none;
    font-size: 1.4rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .gl-overview-header a:hover {
    color: var(--gl-text);
  }

  .gl-overview-header h1 {
    font-size: clamp(1.15rem, 2.5vw, 1.4rem);
    margin: 0;
    color: var(--gl-text);
  }

  .gl-overview-content {
    flex: 1;
    overflow-y: auto;
    padding: clamp(32px, 5vw, 48px) clamp(16px, 4vw, 32px);
    display: flex;
    justify-content: center;
  }

  /* Der Pfad selbst: relative Positionierung, damit die SVG-Verbindungs-
     linien absolut darüber liegen können, exakt wie in der Skizze. */
  .gl-path {
    position: relative;
    width: 100%;
    max-width: 640px;
  }

  .gl-path-intro {
    text-align: center;
    color: var(--gl-text-soft);
    line-height: 1.6;
    margin-bottom: var(--gl-space-4);
  }

  .gl-path-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .gl-path-svg path {
    fill: none;
    stroke: var(--gl-danger);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .gl-nodes {
    position: relative;
    z-index: 1;
  }

  /* Jedes Rechteck sitzt absolut im Pfad-Container, X/Y kommen aus JS
     gemäss der Zickzack-Anordnung aus der Skizze. */
  .gl-node {
    position: absolute;
    width: 46%;
    text-decoration: none;
    display: block;
  }

  .gl-node-box {
    display: flex;
    align-items: center;
    gap: var(--gl-space-2);
    background: var(--gl-surface);
    border: 2px solid var(--gl-border);
    border-radius: var(--gl-radius-md);
    padding: var(--gl-space-2);
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    position: relative;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .gl-node:not(.gl-locked):hover .gl-node-box {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .gl-node.gl-locked {
    cursor: not-allowed;
  }

  .gl-node-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--gl-radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
  }

  .gl-node.gl-next .gl-node-icon {
    background: var(--gl-primary);
    box-shadow: 0 4px 0 var(--gl-primary-shadow);
    color: var(--gl-text-on-accent);
  }

  .gl-node.gl-done .gl-node-icon {
    background: var(--gl-secondary);
    box-shadow: 0 4px 0 var(--gl-secondary-shadow);
    color: var(--gl-text-on-accent);
  }

  .gl-node.gl-locked .gl-node-icon {
    background: var(--gl-border);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--gl-border) 60%, #000);
    color: var(--gl-text-soft);
  }

  .gl-node-body {
    flex: 1;
    min-width: 0;
  }

  .gl-node-title {
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--gl-text);
    margin-bottom: 2px;
  }

  .gl-node.gl-locked .gl-node-title {
    color: var(--gl-text-soft);
  }

  .gl-node-sub {
    font-size: 0.72rem;
    color: var(--gl-text-soft);
    margin-bottom: 6px;
  }

  .gl-node-bar-track {
    width: 100%;
    height: 7px;
    background: var(--gl-border);
    border-radius: 999px;
    overflow: hidden;
  }

  .gl-node-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gl-primary-hover), var(--gl-primary));
  }

  .gl-node-pct {
    flex-shrink: 0;
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--gl-text);
    min-width: 34px;
    text-align: right;
  }

  .gl-node-pct.gl-empty {
    color: var(--gl-text-soft);
    font-weight: 600;
  }

  .gl-node-badge {
    position: absolute;
    top: -10px;
    left: var(--gl-space-2);
    background: var(--gl-surface);
    color: var(--gl-primary-shadow);
    border: 2px solid var(--gl-primary);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .gl-path-footer {
    text-align: center;
    color: var(--gl-text-soft);
    font-size: 0.85rem;
  }

  @media (max-width: 560px) {
    .gl-node { width: 60%; }
  }
</style>
</head>
<body>

<div class="gl-overview-wrap">
  <div class="gl-overview-header">
    <a href="https://learn.glaggle.ch/index.html" title="Zurück">✕</a>
    <h1>Einmaleins üben</h1>
  </div>

  <div class="gl-overview-content">
    <div class="gl-path">
      <p class="gl-path-intro">Arbeite dich Lektion für Lektion durch das Einmaleins — jede Runde hat 15 Fragen.</p>

      <svg class="gl-path-svg" id="glPathSvg" preserveAspectRatio="none"></svg>
      <div class="gl-nodes" id="glNodes"></div>

      <p class="gl-path-footer" id="glPathFooter"></p>
    </div>
  </div>
</div>

<script>
  // Jede Lektion referenziert ihre eigene HTML-Datei im gleichen Ordner.
  // "align" bestimmt die horizontale Position im Zickzack, wie in der Skizze:
  // rechts -> links -> rechts (mit Überlappung im Mittel-Slot) usw.
  const LEKTIONEN = [
    { file: 'lektion-einmaleins.html',   label: 'Lektion 1', sub: '1–10er Reihen',         emoji: '🔢', align: 'right' },
    { file: 'lektion-einmaleins-2.html', label: 'Lektion 2', sub: 'Bunt gemischt',          emoji: '🎲', align: 'left'  },
    { file: 'lektion-einmaleins-3.html', label: 'Lektion 3', sub: 'Bunt gemischt, Runde 2', emoji: '🎯', align: 'right' }
  ];

  // Wird zentral von lesson-engine.js beim Lektionsabschluss befüllt:
  // { "<dateiname>.html": { done: true, pct: 87, lastCompleted: "..." }, ... }
  const GL_PROGRESS_KEY = 'glaggleLessonProgress';

  function glGetProgress() {
    try {
      const raw = localStorage.getItem(GL_PROGRESS_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object') ? obj : {};
    } catch (e) {
      console.warn('Konnte glaggleLessonProgress nicht lesen:', e);
      return {};
    }
  }

  const NODE_HEIGHT = 96;   // ungefähre Höhe einer Karte inkl. Abstand
  const ROW_GAP = 56;       // vertikaler Abstand zwischen den Reihen

  function glBuildLayout() {
    const nodesEl = document.getElementById('glNodes');
    const pathEl = document.querySelector('.gl-path');
    const containerWidth = pathEl.clientWidth;
    const nodeWidthPct = containerWidth <= 560 ? 0.60 : 0.46;
    const nodeWidth = containerWidth * nodeWidthPct;

    const positions = LEKTIONEN.map((lek, i) => {
      const y = i * (NODE_HEIGHT + ROW_GAP);
      let x;
      if (lek.align === 'right') x = containerWidth - nodeWidth;
      else if (lek.align === 'left') x = 0;
      else x = (containerWidth - nodeWidth) / 2;
      return { x, y, w: nodeWidth };
    });

    return { positions, totalHeight: (LEKTIONEN.length - 1) * (NODE_HEIGHT + ROW_GAP) + NODE_HEIGHT };
  }

  function glRenderConnectors(positions, totalHeight) {
    const svg = document.getElementById('glPathSvg');
    svg.setAttribute('viewBox', `0 0 ${document.querySelector('.gl-path').clientWidth} ${totalHeight}`);
    svg.style.height = totalHeight + 'px';

    let pathsHtml = '';
    for (let i = 0; i < positions.length - 1; i++) {
      const from = positions[i];
      const to = positions[i + 1];
      // Startpunkt: unten an der Kante, die zur nächsten Karte zeigt
      const fromX = from.x + (to.x > from.x ? from.w : 0);
      const fromY = from.y + NODE_HEIGHT * 0.55;
      const toX = to.x + (to.x > from.x ? 0 : to.w);
      const toY = to.y + NODE_HEIGHT * 0.45;

      // Sanfte S-Kurve zwischen den beiden Punkten, wie in der Skizze
      const midY = (fromY + toY) / 2;
      const d = `M ${fromX} ${fromY} C ${fromX} ${midY}, ${toX} ${midY}, ${toX} ${toY}`;
      pathsHtml += `<path d="${d}" />`;
    }
    svg.innerHTML = pathsHtml;
  }

  function glRenderNodes(positions, progress) {
    const nodesEl = document.getElementById('glNodes');
    nodesEl.innerHTML = '';
    nodesEl.style.height = (positions[positions.length - 1].y + NODE_HEIGHT) + 'px';

    let nextAssigned = false;

    LEKTIONEN.forEach((lek, i) => {
      const pos = positions[i];
      const entry = progress[lek.file];
      const isDone = !!entry;
      const prevDone = i === 0 || !!progress[LEKTIONEN[i - 1].file];
      const isNext = !isDone && prevDone && !nextAssigned;
      if (isNext) nextAssigned = true;
      const isLocked = !isDone && !isNext;

      const stateClass = isDone ? 'gl-done' : (isNext ? 'gl-next' : 'gl-locked');
      const tag = isLocked ? 'div' : 'a';

      const pct = isDone ? entry.pct : 0;
      const pctLabel = isDone ? `${pct}%` : '–';

      const node = document.createElement(tag);
      node.className = 'gl-node ' + stateClass;
      if (!isLocked) node.setAttribute('href', lek.file);
      node.style.left = pos.x + 'px';
      node.style.top = pos.y + 'px';
      node.style.width = pos.w + 'px';

      node.innerHTML = `
        <div class="gl-node-box">
          ${isNext ? '<div class="gl-node-badge">Weiter</div>' : ''}
          <div class="gl-node-icon">${isDone ? '✓' : (isLocked ? '🔒' : lek.emoji)}</div>
          <div class="gl-node-body">
            <div class="gl-node-title">${lek.label}</div>
            <div class="gl-node-sub">${lek.sub}</div>
            <div class="gl-node-bar-track">
              <div class="gl-node-bar-fill" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="gl-node-pct ${isDone ? '' : 'gl-empty'}">${pctLabel}</div>
        </div>
      `;

      nodesEl.appendChild(node);
    });

    const doneCount = LEKTIONEN.filter(l => progress[l.file]).length;
    document.getElementById('glPathFooter').textContent = doneCount === LEKTIONEN.length
      ? '🎉 Alle Lektionen geschafft — stark!'
      : `${doneCount} von ${LEKTIONEN.length} Lektionen abgeschlossen`;
  }

  function glRenderAll() {
    const progress = glGetProgress();
    console.log('[Einmaleins] gelesener Fortschritt aus localStorage:', progress);
    if (Object.keys(progress).length === 0) {
      console.warn('[Einmaleins] "glaggleLessonProgress" ist leer oder nicht vorhanden. ' +
        'Prüfe: 1) läuft diese Seite auf demselben Origin (Domain+Pfad-Basis) wie die Lektionsseiten? ' +
        '2) wurde die aktualisierte lesson-engine.js wirklich hochgeladen/eingebunden? ' +
        '3) wurde mindestens eine Lektion tatsächlich bis zum Ende durchgespielt?');
    }
    const { positions, totalHeight } = glBuildLayout();
    glRenderConnectors(positions, totalHeight);
    glRenderNodes(positions, progress);
  }

  // Wichtig: erst rendern, wenn Layout-Masse (clientWidth) verfügbar sind —
  // dafür reicht DOMContentLoaded, aber wir bauen zusätzlich bei Resize neu,
  // damit die SVG-Linien nicht verrutschen.
  window.addEventListener('DOMContentLoaded', glRenderAll);
  window.addEventListener('resize', glRenderAll);
</script>

</body>
</html>
