<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lektion 1 — Mathe Grundlagen | Glaggle Learn</title>

<!-- Zentrales Theme & Components — auf JEDER Lektionsseite gleich einbinden.
     Kein eigenes <style> hier nötig — alles Layout/Design kommt aus theme.css -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/components.js" defer></script>
<script src="../../shared/lesson-engine.js" defer></script>
</head>
<body>

<div id="glLessonRoot"></div>

<script>
  // window.onload wartet, bis ALLES (auch lesson-engine.js) komplett fertig geladen ist
  window.addEventListener("load", function() {
      
      // Zur Sicherheit nochmals 0,5 Sekunden warten
      setTimeout(function() {
          GlaggleLesson.mount({
            target: document.getElementById('glLessonRoot'),
            backHref: '../index.html',
            steps: [
              {
                type: 'info',
                title: '👋 Willkommen bei Lektion 1',
                text: 'In dieser Lektion wiederholen wir ein paar Grundlagen der Mathematik. Tippe auf "Weiter", um zu starten.'
              },
              {
                type: 'mc',
                question: 'Was ist 7 + 5?',
                options: ['10', '12', '13', '11'],
                correct: 1
              },
              {
                type: 'mc',
                question: 'Welche Zahl ist eine Primzahl?',
                options: ['9', '15', '17', '21'],
                correct: 2
              },
              {
                type: 'blank',
                question: 'Ergänze: 9 × 6 = ___',
                answer: '54'
              },
              {
                type: 'info',
                title: '💡 Wusstest du?',
                text: 'Eine Primzahl ist eine Zahl grösser als 1, die nur durch 1 und sich selbst teilbar ist.'
              },
              {
                type: 'blank',
                question: 'Wie heisst das Ergebnis einer Division?',
                answer: 'Quotient'
              }
            ]
          });
      }, 500);

  });
</script>


</body>
</html>
