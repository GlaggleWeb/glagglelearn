<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lektion 1 — Mathe Grundlagen | Glaggle Learn</title>

<!-- Zentrales Theme & Components — auf JEDER Lektionsseite gleich einbinden.
     Kein eigenes <style> hier nötig — alles Layout/Design kommt aus theme.css -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/lesson-engine.js" defer></script>
<script src="../../shared/components.js" defer></script>
</head>
<body>

<div class="gl-lesson-wrap">
  <!-- Header mit Fortschrittsbalken — OBEN sticky -->
  <div class="gl-lesson-header">
    <a href="../index.html" title="Zurück">✕</a>
    <glaggle-progress id="glProgress" value="0" max="1"></glaggle-progress>
  </div>

  <!-- Content-Bereich — scrollbar nur hier -->
  <div class="gl-lesson-content">
    <glaggle-card>
      <div id="lesson"></div>
    </glaggle-card>
  </div>

  <!-- Button-Bereich — UNTEN sticky -->
  <div class="gl-lesson-buttons" id="glButtons"></div>
</div>

<script>
  // --- HIER wird der Lektionsinhalt definiert ---
  const steps = [
    {
      type: 'info',
      title: '👋 Willkommen bei Lektion 1',
      text: 'In dieser Lektion wiederholen wir ein paar Grundlagen der Mathematik. Tippe auf "Weiter", um zu starten.'
    },
    {
      type: 'mc',
      question: 'Was ist 7 + 5?',
      options: ['10', '12', '13', '11'],
      correct: 1
    },
    {
      type: 'mc',
      question: 'Welche Zahl ist eine Primzahl?',
      options: ['9', '15', '17', '21'],
      correct: 2
    },
    {
      type: 'blank',
      question: 'Ergänze: 9 × 6 = ___',
      answer: '54'
    },
    {
      type: 'info',
      title: '💡 Wusstest du?',
      text: 'Eine Primzahl ist eine Zahl grösser als 1, die nur durch 1 und sich selbst teilbar ist.'
    },
    {
      type: 'blank',
      question: 'Wie heisst das Ergebnis einer Division?',
      answer: 'Quotient'
    }
  ];

 function formatTime(totalSeconds) {
  const min = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;
  return min > 0 ? `${min}m ${sec}s` : `${sec}s`;
}

function getSprueche(pct) {
  if (pct === 100) return ['🏆 Perfekt! Du bist eine Mathe-Maschine!', '🔥 Kein Fehler — sauber durchgezogen!'];
  if (pct >= 70) return ['💪 Stark! Nur ein kleiner Ausrutscher.', '👏 Fast makellos — weiter so!'];
  if (pct >= 40) return ['🙂 Solide Basis, da geht noch was!', '📈 Übung macht den Meister!'];
  return ['🌱 Jede Lektion macht dich besser!', '☕ Kurz durchatmen und nochmal ran!'];
}

function startLesson() {
  const lessonEl = document.getElementById('lesson');
  const progressEl = document.getElementById('glProgress');
  const buttonsEl = document.getElementById('glButtons');

  new GlaggleLesson(lessonEl, steps, {
    progressEl: progressEl,
    buttonsContainer: buttonsEl,
    onComplete: (correct, totalQuestions, elapsedSeconds) => {
      const pct = totalQuestions > 0 ? Math.round((correct / totalQuestions) * 100) : 0;

      // LP-Berechnung: 5 LP pro richtige Antwort + Zeit-Bonus pro Frage
      const avgSecPerQuestion = totalQuestions > 0 ? elapsedSeconds / totalQuestions : 999;
      let bonusPerCorrect = 0;
      if (avgSecPerQuestion < 30) bonusPerCorrect = 3;
      else if (avgSecPerQuestion < 60) bonusPerCorrect = 1;

      const basePoints = correct * 5;
      const bonusPoints = correct * bonusPerCorrect;
      const totalLP = basePoints + bonusPoints;

      const sprueche = getSprueche(pct);
      const spruch = sprueche[Math.floor(Math.random() * sprueche.length)];

      lessonEl.innerHTML = `
        <div class="gl-step" style="text-align:center;">
          <h2>🎉 Lektion abgeschlossen!</h2>
          <div class="gl-result-stats">
            <div class="gl-result-box">
              <div class="gl-result-value">${formatTime(elapsedSeconds)}</div>
              <div class="gl-result-label">Zeit</div>
            </div>
            <div class="gl-result-box">
              <div class="gl-result-value">${pct}%</div>
              <div class="gl-result-label">Richtig</div>
            </div>
            <div class="gl-result-box">
              <div class="gl-result-value">${totalLP} LP</div>
              <div class="gl-result-label">${bonusPoints > 0 ? `+${bonusPoints} Bonus` : 'Learn Points'}</div>
            </div>
          </div>
          <p class="gl-result-quote">${spruch}</p>
        </div>
      `;

      const finishBtn = document.createElement('glaggle-button');
      finishBtn.setAttribute('text', 'Zur Startseite');
      finishBtn.setAttribute('variant', 'primary');
      finishBtn.setAttribute('full-width', '');
      finishBtn.id = 'glFinish';
      buttonsEl.innerHTML = '';
      buttonsEl.appendChild(finishBtn);
      finishBtn.addEventListener('glaggle-click', () => {
        window.location.href = '../index.html';
      });
    }
  });
}

Promise.all([
  customElements.whenDefined('glaggle-button'),
  customElements.whenDefined('glaggle-card'),
  customElements.whenDefined('glaggle-progress')
]).then(startLesson);
</script>

</body>
</html>
