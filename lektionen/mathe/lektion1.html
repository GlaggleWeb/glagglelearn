<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lektion 1 — Mathe Grundlagen | Glaggle Learn</title>

<!-- Zentrales Theme & Components — auf JEDER Lektionsseite gleich einbinden.
     Kein eigenes <style> hier nötig — alles Layout/Design kommt aus theme.css -->
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/components.js" defer></script>
<script src="../../shared/lesson-engine.js" defer></script>
</head>
<body>

<div class="gl-lesson-wrap">
  <!-- Header mit Fortschrittsbalken — OBEN sticky -->
  <div class="gl-lesson-header">
    <a href="../index.html" title="Zurück">✕</a>
    <glaggle-progress id="glProgress" value="0" max="1"></glaggle-progress>
  </div>

  <!-- Content-Bereich — scrollbar nur hier -->
  <div class="gl-lesson-content">
    <glaggle-card>
      <div id="lesson"></div>
    </glaggle-card>
  </div>

  <!-- Button-Bereich — UNTEN sticky -->
  <div class="gl-lesson-buttons" id="glButtons"></div>
</div>

<script>
  // --- HIER wird der Lektionsinhalt definiert ---
  const steps = [
    {
      type: 'info',
      title: '👋 Willkommen bei Lektion 1',
      text: 'In dieser Lektion wiederholen wir ein paar Grundlagen der Mathematik. Tippe auf "Weiter", um zu starten.'
    },
    {
      type: 'mc',
      question: 'Was ist 7 + 5?',
      options: ['10', '12', '13', '11'],
      correct: 1
    },
    {
      type: 'mc',
      question: 'Welche Zahl ist eine Primzahl?',
      options: ['9', '15', '17', '21'],
      correct: 2
    },
    {
      type: 'blank',
      question: 'Ergänze: 9 × 6 = ___',
      answer: '54'
    },
    {
      type: 'info',
      title: '💡 Wusstest du?',
      text: 'Eine Primzahl ist eine Zahl grösser als 1, die nur durch 1 und sich selbst teilbar ist.'
    },
    {
      type: 'blank',
      question: 'Wie heisst das Ergebnis einer Division?',
      answer: 'Quotient'
    }
  ];

  function startLesson() {
    const lessonEl = document.getElementById('lesson');
    const progressEl = document.getElementById('glProgress');
    const buttonsEl = document.getElementById('glButtons');

    new GlaggleLesson(lessonEl, steps, {
      progressEl: progressEl,
      buttonsContainer: buttonsEl,
      onComplete: (correct, total) => {
        lessonEl.innerHTML = `
          <div class="gl-step" style="text-align:center;">
            <h2>🎉 Lektion abgeschlossen!</h2>
            <p class="gl-step-text">Du hast ${correct} von ${total} Fragen richtig beantwortet.</p>
          </div>
        `;
        const finishBtn = document.createElement('glaggle-button');
        finishBtn.setAttribute('text', 'Zur Startseite');
        finishBtn.setAttribute('variant', 'primary');
        finishBtn.setAttribute('full-width', '');
        finishBtn.id = 'glFinish';
        buttonsEl.innerHTML = '';
        buttonsEl.appendChild(finishBtn);
        finishBtn.addEventListener('glaggle-click', () => {
          window.location.href = '../index.html';
        });
      }
    });
  }

  // Warten bis Custom Elements registriert sind
  Promise.all([
    customElements.whenDefined('glaggle-button'),
    customElements.whenDefined('glaggle-card'),
    customElements.whenDefined('glaggle-progress')
  ]).then(startLesson);
</script>

</body>
</html>
